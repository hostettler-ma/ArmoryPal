name: Weekly AI exploratory test

# Once a week, Claude explores a throwaway copy of ArmoryPal in two browsers
# (an admin on a phone screen and a regular player on desktop): clicking
# everything, trying bad input and attacking it. The findings are posted as a
# GitHub issue. It complements the nightly suite, which only checks what it
# was written to check.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`
# and paste the result; uses your Claude subscription) or ANTHROPIC_API_KEY
# (billed to the API).

on:
  schedule:
    - cron: "43 14 * * 0" # Sundays 14:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - name: Check for Claude credentials
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token') or ANTHROPIC_API_KEY repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-stack

      - name: Start the app and sign in two players
        run: |
          npm start > "$RUNNER_TEMP/next.log" 2>&1 &
          npx wait-on@8.0.4 --timeout 60000 http://localhost:3000/login
          npx tsx e2e/support/explore-setup.mts http://localhost:3000

      - name: Explore
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Read .github/explore/prompt.md and .explore/players.md, then do exactly what the prompt says.
          claude_args: >-
            --mcp-config .github/explore/mcp.json
            --allowedTools "mcp__alice__*,mcp__bob__*,Read,Glob,Grep,Write(explore-report.md),Bash(curl:*)"
            --max-turns 250

      - name: Post the report
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync("explore-report.md")
              ? fs.readFileSync("explore-report.md", "utf8")
              : "Claude didn't write a report this week. Check the run log.";
            const label = "ai-exploration";
            await github.rest.issues.createLabel({ ...context.repo, name: label, color: "5319e7" }).catch(() => {});
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              ...context.repo,
              title: `Weekly exploratory test (${today})`,
              labels: [label],
              body: `${report}\n\n---\n[Run log and browser traces](${run}) (artifact **explore-traces**)`,
            });

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: explore-traces
          path: |
            .explore/alice/
            .explore/bob/
            explore-report.md
          retention-days: 14
