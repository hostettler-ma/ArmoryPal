name: Nightly tests

# Every night: build a throwaway copy of ArmoryPal (local Supabase + production
# build) inside the runner, click through it in a phone and a desktop browser,
# attack it, scan it with OWASP ZAP and audit dependencies. Then a few
# read-only checks against the live site. A failure opens (or updates) one
# GitHub issue; the next green run closes it.

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC = early morning in New York
  workflow_dispatch:
  pull_request:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  local:
    name: Browser, security and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-stack

      # A failure in one group is reported, but the remaining groups still run.
      - name: Unit tests
        run: npm test 2>&1 | tee unit-tests.txt; exit ${PIPESTATUS[0]}

      - name: Database rule tests
        if: ${{ !cancelled() }}
        run: npm run test:db 2>&1 | tee db-tests.txt; exit ${PIPESTATUS[0]}

      - name: Install browser
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      - name: Browser tests (functional + security)
        if: ${{ !cancelled() }}
        run: npx playwright test

      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npx tsx scripts/audit-check.mts | tee audit.txt

      - name: ZAP scan (signed in, against the local copy)
        if: ${{ !cancelled() }}
        run: |
          npm start > "$RUNNER_TEMP/next.log" 2>&1 &
          npx wait-on@8.0.4 --timeout 60000 http://localhost:3000/login
          cookie=$(npx tsx e2e/support/scan-session.mts | tail -1)
          echo "::add-mask::$cookie"
          mkdir -p zap && chmod 777 zap && cp .github/zap-rules.tsv zap/
          # Every request carries the session cookie, so ZAP reaches the signed-in pages.
          # -I: don't fail here; e2e/support/summarize.mts decides what counts.
          timeout 40m docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t http://localhost:3000/ -m 3 -I -c zap-rules.tsv \
              -r zap-report.html -J zap.json \
              -z "-config scanner.maxScanDurationInMins=20 \
                  -config scanner.maxRuleDurationInMins=3 \
                  -config replacer.full_list(0).description=session \
                  -config replacer.full_list(0).enabled=true \
                  -config replacer.full_list(0).matchtype=REQ_HEADER \
                  -config replacer.full_list(0).matchstr=Cookie \
                  -config replacer.full_list(0).regex=false \
                  -config replacer.full_list(0).replacement=$cookie" || true
          cp zap/zap.json . 2>/dev/null || echo "ZAP produced no report"

      - name: Summarize
        id: summary
        if: ${{ !cancelled() }}
        run: |
          set +e
          npx tsx e2e/support/summarize.mts > summary.md
          echo "failed=$([ $? -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nightly-report
          path: |
            playwright-report/
            test-results/
            zap/zap-report.html
            summary.md
            unit-tests.txt
            db-tests.txt
          retention-days: 14

      - name: Report
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.summary.outputs.failed }}
        with:
          script: |
            const fs = require("fs");
            const summary = fs.existsSync("summary.md") ? fs.readFileSync("summary.md", "utf8") : "(no summary)";
            const failed = process.env.FAILED !== "false";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${summary}\n\n[Full run, screenshots, traces and ZAP report](${run}) (artifact **nightly-report**)`;

            if (context.eventName === "pull_request") {
              // One comment per PR, kept up to date.
              const marker = "<!-- nightly-tests -->";
              const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
              const mine = comments.find((c) => c.body?.includes(marker));
              const text = `${marker}\n## Nightly test suite on this PR: ${failed ? "❌" : "✅"}\n\n${body}`;
              if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body: text });
              else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: text });
              if (failed) core.setFailed("Nightly suite failed");
              return;
            }

            const label = "nightly-failure";
            await github.rest.issues.createLabel({ ...context.repo, name: label, color: "d73a4a" }).catch(() => {});
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: "open" });
            const today = new Date().toISOString().slice(0, 10);
            if (failed) {
              if (open[0]) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body: `**Still failing on ${today}**\n\n${body}` });
              else await github.rest.issues.create({ ...context.repo, title: `Nightly tests failing (${today})`, labels: [label], body });
              core.setFailed("Nightly suite failed");
            } else {
              for (const issue of open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `✅ Passing again on ${today}. Closing.\n\n${body}` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
              }
            }

  production:
    name: Read-only checks against the live site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      E2E_TARGET: prod
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://armorypal.vercel.app' }}
      PROD_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL || 'https://hlfjqfwiotpvbjrslrnn.supabase.co' }}
      # The publishable key is public (it's in the app's JavaScript). Set it as a repository variable.
      PROD_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npx playwright test
      - name: Summarize
        id: summary
        if: ${{ !cancelled() }}
        run: |
          set +e
          npx tsx e2e/support/summarize.mts > summary.md
          echo "failed=$([ $? -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const summary = fs.existsSync("summary.md") ? fs.readFileSync("summary.md", "utf8") : "(no summary)";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = "production-check";
            await github.rest.issues.createLabel({ ...context.repo, name: label, color: "b60205" }).catch(() => {});
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: "open" });
            const today = new Date().toISOString().slice(0, 10);
            const body = `${summary}\n\n[Run](${run})`;
            if (open[0]) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body: `**Still failing on ${today}**\n\n${body}` });
            else await github.rest.issues.create({ ...context.repo, title: `Live site check failing (${today})`, labels: [label], body });
